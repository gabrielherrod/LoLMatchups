
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Matchup Database</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0f;
      color: #e5e5e5;
    }

    header {
      background: linear-gradient(90deg, #4ec9f0, #7b5cff);
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #0a0a0f;
    }

    nav {
      background: #111;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    nav a {
      color: #cfcfcf;
      margin: 0 18px;
      text-decoration: none;
      font-size: 17px;
      transition: 0.2s;
    }

    nav a:hover {
      color: #4ec9f0;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: radial-gradient(circle at top, #1a1a25, #0a0a0f);
      border-bottom: 1px solid #222;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
      color: #4ec9f0;
    }

    .hero p {
      font-size: 18px;
      max-width: 700px;
      margin: auto;
      color: #bfbfbf;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: #14141b;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #222;
      transition: 0.2s;
    }

    .card:hover {
      border-color: #4ec9f0;
      transform: translateY(-3px);
    }
